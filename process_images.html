<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>猫咪图片批量处理工具</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #1a1a2e;
            color: #eee;
            padding: 20px;
            min-height: 100vh;
        }
        h1 { text-align: center; margin-bottom: 20px; color: #f4a460; }
        .controls {
            text-align: center;
            margin-bottom: 30px;
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            align-items: center;
        }
        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        label { font-size: 14px; }
        input[type="range"] { width: 120px; }
        input[type="number"] { width: 70px; padding: 4px; }
        button {
            padding: 10px 25px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .img-card {
            background: #16213e;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
        }
        .img-card .title {
            font-size: 12px;
            margin-bottom: 10px;
            color: #aaa;
        }
        .img-card canvas {
            max-width: 128px;
            max-height: 128px;
            background: repeating-conic-gradient(#333 0% 25%, #2a2a2a 0% 50%) 50% / 16px 16px;
            border-radius: 8px;
            border: 1px solid #333;
        }
        .img-card .info {
            font-size: 11px;
            margin-top: 8px;
            color: #888;
        }
        .status {
            text-align: center;
            margin: 20px 0;
            color: #4ade80;
            font-size: 14px;
        }
        .download-section {
            text-align: center;
            margin: 30px 0;
        }
        .tolerance-val { font-weight: bold; color: #f4a460; min-width: 30px; display: inline-block; }
    </style>
</head>
<body>
    <h1>🐱 猫咪图片批量处理工具</h1>
    
    <div class="controls">
        <div class="control-group">
            <label>背景容差:</label>
            <input type="range" id="tolerance" min="10" max="100" value="40">
            <span class="tolerance-val" id="toleranceVal">40</span>
        </div>
        <div class="control-group">
            <label>目标尺寸:</label>
            <input type="number" id="targetSize" value="128" min="32" max="512">
            <span>px</span>
        </div>
        <div class="control-group">
            <label>内边距:</label>
            <input type="number" id="padding" value="6" min="0" max="32">
            <span>px</span>
        </div>
        <button id="processBtn">处理所有图片</button>
        <button id="downloadAllBtn" disabled>打包下载全部</button>
    </div>
    
    <div class="status" id="status">点击"处理所有图片"开始</div>
    
    <div class="grid" id="imageGrid"></div>

    <script>
        // 图片列表
        const imageList = [
            { name: 'init', path: 'res/init/init.png' },
            { name: 'up', path: 'res/move/up/up.png' },
            { name: 'down', path: 'res/move/down/down.png' },
            { name: 'left', path: 'res/move/left/left.png' },
            { name: 'right', path: 'res/move/right/right.png' },
            { name: 'left_up', path: 'res/move/left_up/left_up.png' },
            { name: 'left_down', path: 'res/move/left_down/left_down.png' },
            { name: 'right_up', path: 'res/move/right_up/right_up.png' },
            { name: 'right_down', path: 'res/move/right_down/right_down.png' },
        ];

        let processedImages = {};
        const grid = document.getElementById('imageGrid');
        const status = document.getElementById('status');
        const toleranceInput = document.getElementById('tolerance');
        const toleranceVal = document.getElementById('toleranceVal');
        const targetSizeInput = document.getElementById('targetSize');
        const paddingInput = document.getElementById('padding');
        const processBtn = document.getElementById('processBtn');
        const downloadAllBtn = document.getElementById('downloadAllBtn');

        toleranceInput.addEventListener('input', () => {
            toleranceVal.textContent = toleranceInput.value;
        });

        // 加载图片
        function loadImage(src) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = reject;
                img.src = src;
            });
        }

        // 泛洪填充识别背景
        function floodFillBackground(imageData, tolerance) {
            const { width, height, data } = imageData;
            const visited = new Uint8Array(width * height);
            const alpha = new Uint8ClampedArray(width * height).fill(255);

            function getIdx(x, y) { return y * width + x; }
            function getColor(x, y) {
                const idx = getIdx(x, y) * 4;
                return [data[idx], data[idx+1], data[idx+2]];
            }
            function colorDist(c1, c2) {
                const dr = c1[0] - c2[0];
                const dg = c1[1] - c2[1];
                const db = c1[2] - c2[2];
                return Math.sqrt(dr*dr + dg*dg + db*db);
            }

            // 种子点：四角和边缘中点
            const seeds = [
                [0, 0], [width-1, 0], [0, height-1], [width-1, height-1],
                [Math.floor(width/2), 0], [Math.floor(width/2), height-1],
                [0, Math.floor(height/2)], [width-1, Math.floor(height/2)]
            ];

            // 计算背景色均值
            let bgR = 0, bgG = 0, bgB = 0, bgCount = 0;
            for (const [sx, sy] of seeds) {
                if (sx >= 0 && sx < width && sy >= 0 && sy < height) {
                    const [r, g, b] = getColor(sx, sy);
                    bgR += r; bgG += g; bgB += b; bgCount++;
                }
            }
            const bgColor = [bgR / bgCount, bgG / bgCount, bgB / bgCount];

            // BFS泛洪
            const queue = [];
            for (const [sx, sy] of seeds) {
                if (sx >= 0 && sx < width && sy >= 0 && sy < height) {
                    const dist = colorDist(getColor(sx, sy), bgColor);
                    if (dist <= tolerance * 1.5) {
                        queue.push([sx, sy]);
                        visited[getIdx(sx, sy)] = 1;
                    }
                }
            }

            const dirs = [[-1,0],[1,0],[0,-1],[0,1]];
            while (queue.length > 0) {
                const [x, y] = queue.shift();
                const dist = colorDist(getColor(x, y), bgColor);
                if (dist <= tolerance) {
                    alpha[getIdx(x, y)] = 0;
                    for (const [dx, dy] of dirs) {
                        const nx = x + dx, ny = y + dy;
                        if (nx >= 0 && nx < width && ny >= 0 && ny < height && !visited[getIdx(nx, ny)]) {
                            const ndist = colorDist(getColor(nx, ny), bgColor);
                            if (ndist <= tolerance * 2) {
                                visited[getIdx(nx, ny)] = 1;
                                queue.push([nx, ny]);
                            }
                        }
                    }
                }
            }

            // 边缘羽化：简单的alpha模糊
            const alphaCopy = new Uint8ClampedArray(alpha);
            const featherRadius = 1;
            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    if (alpha[getIdx(x, y)] > 0) {
                        let sum = 0, count = 0;
                        for (let dy = -featherRadius; dy <= featherRadius; dy++) {
                            for (let dx = -featherRadius; dx <= featherRadius; dx++) {
                                const nx = x + dx, ny = y + dy;
                                if (nx >= 0 && nx < width && ny >= 0 && ny < height) {
                                    sum += alphaCopy[getIdx(nx, ny)];
                                    count++;
                                }
                            }
                        }
                        alpha[getIdx(x, y)] = Math.max(alphaCopy[getIdx(x, y)], sum / count);
                    }
                }
            }

            return alpha;
        }

        // 找到内容边界框
        function findContentBounds(alpha, width, height) {
            let minX = width, minY = height, maxX = 0, maxY = 0;
            let hasContent = false;
            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    if (alpha[y * width + x] > 10) {
                        minX = Math.min(minX, x);
                        minY = Math.min(minY, y);
                        maxX = Math.max(maxX, x);
                        maxY = Math.max(maxY, y);
                        hasContent = true;
                    }
                }
            }
            return hasContent ? { minX, minY, maxX, maxY } : null;
        }

        // 处理单张图片
        function processImage(img, tolerance, targetSize, padding) {
            // 创建临时canvas读取原始图片
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = img.naturalWidth;
            tempCanvas.height = img.naturalHeight;
            const tempCtx = tempCanvas.getContext('2d');
            tempCtx.drawImage(img, 0, 0);
            
            const imageData = tempCtx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);
            
            // 1. 去除背景
            const alpha = floodFillBackground(imageData, tolerance);
            
            // 写回alpha
            for (let i = 0; i < alpha.length; i++) {
                imageData.data[i * 4 + 3] = alpha[i];
            }
            tempCtx.putImageData(imageData, 0, 0);
            
            // 2. 裁剪到内容区域
            const bounds = findContentBounds(alpha, tempCanvas.width, tempCanvas.height);
            let croppedCanvas = tempCanvas;
            if (bounds) {
                const cropW = bounds.maxX - bounds.minX + 1 + padding * 2;
                const cropH = bounds.maxY - bounds.minY + 1 + padding * 2;
                croppedCanvas = document.createElement('canvas');
                croppedCanvas.width = cropW;
                croppedCanvas.height = cropH;
                const cropCtx = croppedCanvas.getContext('2d');
                cropCtx.drawImage(
                    tempCanvas,
                    bounds.minX - padding, bounds.minY - padding,
                    cropW, cropH,
                    0, 0, cropW, cropH
                );
            }
            
            // 3. 缩放到目标尺寸（保持比例居中）
            const scale = Math.min(targetSize / croppedCanvas.width, targetSize / croppedCanvas.height);
            const scaledW = Math.round(croppedCanvas.width * scale);
            const scaledH = Math.round(croppedCanvas.height * scale);
            
            const finalCanvas = document.createElement('canvas');
            finalCanvas.width = targetSize;
            finalCanvas.height = targetSize;
            const finalCtx = finalCanvas.getContext('2d');
            finalCtx.imageSmoothingEnabled = true;
            finalCtx.imageSmoothingQuality = 'high';
            
            const offsetX = Math.floor((targetSize - scaledW) / 2);
            const offsetY = Math.floor((targetSize - scaledH) / 2);
            finalCtx.drawImage(croppedCanvas, offsetX, offsetY, scaledW, scaledH);
            
            // 4. 轻微锐化效果（通过对比度增强）
            const finalData = finalCtx.getImageData(0, 0, targetSize, targetSize);
            applySharpen(finalData, targetSize, targetSize);
            finalCtx.putImageData(finalData, 0, 0);
            
            return {
                canvas: finalCanvas,
                originalSize: { w: img.naturalWidth, h: img.naturalHeight },
                contentSize: bounds ? { w: bounds.maxX - bounds.minX + 1, h: bounds.maxY - bounds.minY + 1 } : { w: croppedCanvas.width, h: croppedCanvas.height }
            };
        }

        // 简单锐化卷积
        function applySharpen(imageData, width, height) {
            const data = imageData.data;
            const weights = [
                0, -0.3, 0,
                -0.3, 2.2, -0.3,
                0, -0.3, 0
            ];
            
            const copy = new Uint8ClampedArray(data);
            
            for (let y = 1; y < height - 1; y++) {
                for (let x = 1; x < width - 1; x++) {
                    for (let c = 0; c < 3; c++) {
                        let sum = 0;
                        for (let ky = -1; ky <= 1; ky++) {
                            for (let kx = -1; kx <= 1; kx++) {
                                const idx = ((y + ky) * width + (x + kx)) * 4 + c;
                                sum += copy[idx] * weights[(ky + 1) * 3 + (kx + 1)];
                            }
                        }
                        data[(y * width + x) * 4 + c] = Math.max(0, Math.min(255, sum));
                    }
                }
            }
        }

        // 创建图片卡片
        function createImageCard(name) {
            const card = document.createElement('div');
            card.className = 'img-card';
            card.innerHTML = `
                <div class="title">${name}</div>
                <canvas width="128" height="128"></canvas>
                <div class="info">等待处理...</div>
            `;
            grid.appendChild(card);
            return card;
        }

        // 处理所有图片
        async function processAll() {
            processBtn.disabled = true;
            downloadAllBtn.disabled = true;
            grid.innerHTML = '';
            processedImages = {};
            
            const tolerance = parseInt(toleranceInput.value);
            const targetSize = parseInt(targetSizeInput.value);
            const padding = parseInt(paddingInput.value);
            
            let successCount = 0;
            
            for (const item of imageList) {
                status.textContent = `正在处理: ${item.name}...`;
                const card = createImageCard(item.name);
                const canvas = card.querySelector('canvas');
                
                try {
                    const img = await loadImage(item.path);
                    const result = processImage(img, tolerance, targetSize, padding);
                    
                    // 绘制到显示canvas
                    canvas.width = targetSize;
                    canvas.height = targetSize;
                    canvas.getContext('2d').drawImage(result.canvas, 0, 0);
                    
                    card.querySelector('.info').textContent = 
                        `原始: ${result.originalSize.w}x${result.originalSize.h} → 内容: ${result.contentSize.w}x${result.contentSize.h} → ${targetSize}x${targetSize}`;
                    
                    processedImages[item.name] = result.canvas;
                    successCount++;
                } catch (err) {
                    card.querySelector('.info').textContent = '处理失败: ' + err.message;
                    console.error(`处理 ${item.name} 失败:`, err);
                }
                
                // 给UI喘息时间
                await new Promise(r => setTimeout(r, 50));
            }
            
            status.textContent = `处理完成！成功 ${successCount}/${imageList.length} 张图片`;
            processBtn.disabled = false;
            downloadAllBtn.disabled = successCount === 0;
        }

        // 下载单张
        function downloadCanvas(canvas, filename) {
            const link = document.createElement('a');
            link.download = filename;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        // 打包下载
        async function downloadAll() {
            for (const item of imageList) {
                if (processedImages[item.name]) {
                    let filename;
                    if (item.name === 'init') {
                        filename = 'init.png';
                    } else {
                        filename = `${item.name}.png`;
                    }
                    downloadCanvas(processedImages[item.name], filename);
                    await new Promise(r => setTimeout(r, 200));
                }
            }
        }

        processBtn.addEventListener('click', processAll);
        downloadAllBtn.addEventListener('click', downloadAll);

        // 初始加载显示原图
        window.addEventListener('load', async () => {
            for (const item of imageList) {
                const card = createImageCard(item.name);
                const canvas = card.querySelector('canvas');
                try {
                    const img = await loadImage(item.path);
                    const ctx = canvas.getContext('2d');
                    const scale = Math.min(128 / img.naturalWidth, 128 / img.naturalHeight);
                    const w = img.naturalWidth * scale;
                    const h = img.naturalHeight * scale;
                    canvas.width = 128;
                    canvas.height = 128;
                    ctx.fillStyle = '#333';
                    ctx.fillRect(0, 0, 128, 128);
                    ctx.drawImage(img, (128-w)/2, (128-h)/2, w, h);
                    card.querySelector('.info').textContent = `原始尺寸: ${img.naturalWidth}x${img.naturalHeight}`;
                } catch(e) {
                    card.querySelector('.info').textContent = '加载失败';
                }
            }
        });
    </script>
</body>
</html>
